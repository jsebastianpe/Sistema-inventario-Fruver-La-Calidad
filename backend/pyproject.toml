[project]
name = "fruver-gestion"
version = "0.1.0"
description = "Sistema de gestión comercial para negocio de frutas y verduras"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "starlette==1.8.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.40",
    "psycopg[binary]==3.2.9",
    "alembic==1.15.2",
    "argon2-cffi==23.1.0",
    "httpx==0.28.1",
    "defusedxml==0.7.1",
    "apscheduler==3.11.0",
    "openpyxl==3.1.5",
    "tzdata==2025.2",
    "email-validator==2.2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pip-audit==2.10.1"]
e2e = ["playwright==1.52.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
