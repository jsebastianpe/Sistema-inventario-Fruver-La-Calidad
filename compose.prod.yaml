# Producción: Caddy publica 80/443 con certificados TLS automáticos (Let's Encrypt).
# La API y PostgreSQL solo son accesibles dentro de la red interna de Docker.
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Defina PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    networks: [backend]

  api:
    environment:
      APP_ENV: production

  worker:
    environment:
      APP_ENV: production

volumes:
  caddy_data:
  caddy_config:
